<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stelen im Größenvergleich</title>
<style>
  :root {
    --page: #f6f5f2;
    --ink: #1f1f1f;
    --muted: #6b6862;
    --wall: #ecebe7;
    --floor: #dad7d0;
    --box: #ffffff;
    --box-edge: #b4b0a8;
    --person: #2a2a2a;
    --guide: #a29d94;
    --accent: #c4541c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  figure { margin: 0; background: var(--wall); border-radius: 10px; overflow: hidden; }
  svg { display: block; width: 100%; height: auto; }
  figcaption { color: var(--muted); font-size: .85rem; padding: 10px 14px; background: var(--page); }
  table { border-collapse: collapse; width: 100%; margin-top: 24px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #dedbd5; }
  th { font-weight: 600; color: var(--muted); font-size: .85rem; }
  td.num, th.num { text-align: right; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>Vier Stelen und ein Mensch (1,80 m)</h1>
  <p class="sub">Frontalansicht, alle Maße exakt maßstabsgetreu: 1 SVG-Einheit entspricht 1 cm.</p>

  <figure>
    <svg id="scene" role="img" aria-labelledby="scene-title"></svg>
    <figcaption>Maßstab links in 10-cm-Schritten. Abstand zwischen den Stelen: 10 cm (in <code>CONFIG.gap</code> einstellbar).</figcaption>
  </figure>

  <div class="wrap"><table id="tbl"></table></div>
</main>

<script>
// ---------------------------------------------------------------
// Alle Maße in Zentimetern. Die SVG-ViewBox ist in cm angelegt,
// dadurch stimmen die Größenverhältnisse exakt.
// ---------------------------------------------------------------
const CONFIG = {
  personHeight: 180,
  personX: 20,          // Mittelachse der Person
  firstBoxX: 70,        // linke Kante von Box 1
  gap: 10,              // Abstand zwischen den Stelen
  boxes: [
    { name: "Box 1", h: 100, w: 85 },
    { name: "Box 2", h: 100, w: 45 },
    { name: "Box 3", h: 75,  w: 40 },
    { name: "Box 4", h: 50,  w: 30 },
  ],
};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("scene");
function el(tag, attrs = {}, parent = svg, text) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  parent.appendChild(n);
  return n;
}
const fmt = (cm) => (cm / 100).toFixed(2).replace(".", ",") + " m";

// Boden liegt bei y = 0, Höhen gehen nach oben (negatives y).
let x = CONFIG.firstBoxX;
const boxes = CONFIG.boxes.map(b => { const r = { ...b, x }; x += b.w + CONFIG.gap; return r; });
const sceneRight = x - CONFIG.gap;
const VB = { x: -45, y: -205, w: sceneRight + 25 + 45, h: 205 + 38 };
svg.setAttribute("viewBox", `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
el("title", { id: "scene-title" }, svg,
  "Maßstabsgetreue Frontalansicht: Mensch 1,80 m neben vier weißen Stelen");

const defs = el("defs");
const f = el("filter", { id: "soft", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs);
el("feGaussianBlur", { stdDeviation: "2.2" }, f);

// Boden
el("rect", { x: VB.x, y: 0, width: VB.w, height: VB.h, fill: "var(--floor)" });
el("line", { x1: VB.x, y1: 0, x2: VB.x + VB.w, y2: 0, stroke: "#bfbab1", "stroke-width": 0.4 });

// Hilfslinien bei relevanten Höhen
const guideHeights = [...new Set([CONFIG.personHeight, ...CONFIG.boxes.map(b => b.h)])];
for (const h of guideHeights) {
  el("line", { x1: -22, y1: -h, x2: sceneRight + 8, y2: -h,
    stroke: "var(--guide)", "stroke-width": 0.25, "stroke-dasharray": "1.5 1.5" });
}

// Maßstab links (Lineal 0–200 cm)
const rx = -28;
el("line", { x1: rx, y1: 0, x2: rx, y2: -200, stroke: "var(--ink)", "stroke-width": 0.4 });
for (let h = 0; h <= 200; h += 5) {
  const major = h % 10 === 0;
  el("line", { x1: rx, y1: -h, x2: rx + (major ? 4 : 2), y2: -h, stroke: "var(--ink)", "stroke-width": major ? 0.35 : 0.2 });
  if (h % 50 === 0) {
    el("text", { x: rx - 2, y: -h + 1.3, "font-size": 3.6, "text-anchor": "end", fill: "var(--muted)" }, svg, h + " cm");
  }
}

// Stelen
for (const b of boxes) {
  // weicher Schattenwurf am Boden
  el("ellipse", { cx: b.x + b.w / 2 + 3, cy: 0.6, rx: b.w / 2 + 4, ry: 2.2, fill: "#000", opacity: 0.18, filter: "url(#soft)" });
  el("rect", { x: b.x, y: -b.h, width: b.w, height: b.h, fill: "var(--box)", stroke: "var(--box-edge)", "stroke-width": 0.35 });
  // leichte Kantenschattierung rechts für Körperlichkeit (innerhalb der Kontur, ändert die Maße nicht)
  el("rect", { x: b.x + b.w - 1.6, y: -b.h + 0.2, width: 1.4, height: b.h - 0.4, fill: "#000", opacity: 0.04 });

  const cx = b.x + b.w / 2;
  el("text", { x: cx, y: -b.h / 2 - 1.5, "font-size": 4, "font-weight": 600, "text-anchor": "middle", fill: "var(--ink)" }, svg, b.name);
  el("text", { x: cx, y: -b.h / 2 + 3.5, "font-size": 3.3, "text-anchor": "middle", fill: "var(--muted)" }, svg, `${b.h} × ${b.w} cm`);

  // Breitenbemaßung unter dem Boden
  const dy = 9;
  el("line", { x1: b.x, y1: 3, x2: b.x, y2: dy + 2, stroke: "var(--muted)", "stroke-width": 0.2 });
  el("line", { x1: b.x + b.w, y1: 3, x2: b.x + b.w, y2: dy + 2, stroke: "var(--muted)", "stroke-width": 0.2 });
  el("line", { x1: b.x, y1: dy, x2: b.x + b.w, y2: dy, stroke: "var(--muted)", "stroke-width": 0.25 });
  for (const tx of [b.x, b.x + b.w]) {
    el("line", { x1: tx - 1, y1: dy + 1, x2: tx + 1, y2: dy - 1, stroke: "var(--ink)", "stroke-width": 0.35 });
  }
  el("text", { x: cx, y: dy + 6, "font-size": 3.4, "text-anchor": "middle", fill: "var(--ink)" }, svg, `${b.w} cm`);
}

// ---------------------------------------------------------------
// Silhouette: Kontur in cm, y = 0 Scheitel, y = 180 Fußsohle.
// Wird anschließend exakt auf CONFIG.personHeight skaliert.
// "s" markiert harte Ecken (Fußsohle bleibt dadurch exakt auf dem Boden).
// ---------------------------------------------------------------
const half = [
  [5.5, 20], [6, 26], [14, 28.5], [20.5, 30.5], [23.5, 35], [24.5, 48], [25.5, 66],
  [27, 88], [28, 96], [28.5, 104], [27, 109], [24.5, 110.5], [22.5, 106], [22, 96],
  [21.5, 88], [20, 67], [18.5, 50], [17.5, 44], [15.5, 58], [14.5, 72], [16.5, 84],
  [17.5, 94], [16, 112], [13.5, 130], [12, 150], [10.5, 169], [12.8, 175],
  [13, 180, "s"], [3.5, 180, "s"], [3.6, 174], [4, 160], [4.5, 131], [3.5, 112], [1.5, 98],
];
const outline = [
  [0, 19.5],
  ...half,
  [0, 97],
  ...half.slice().reverse().map(([px, py, s]) => [-px, py, s]),
];
function smoothClosedPath(pts) {
  const n = pts.length, P = i => pts[(i + n) % n];
  const tan = i => P(i)[2] === "s" ? [0, 0] :
    [(P(i + 1)[0] - P(i - 1)[0]) / 6, (P(i + 1)[1] - P(i - 1)[1]) / 6];
  let d = `M${P(0)[0]},${P(0)[1]}`;
  for (let i = 0; i < n; i++) {
    const a = P(i), b = P(i + 1), ta = tan(i), tb = tan(i + 1);
    d += ` C${a[0] + ta[0]},${a[1] + ta[1]} ${b[0] - tb[0]},${b[1] - tb[1]} ${b[0]},${b[1]}`;
  }
  return d + "Z";
}
const k = CONFIG.personHeight / 180;
el("ellipse", { cx: CONFIG.personX + 3, cy: 0.6, rx: 20, ry: 2.2, fill: "#000", opacity: 0.18, filter: "url(#soft)" });
const person = el("g", { id: "person", transform: `translate(${CONFIG.personX} ${-CONFIG.personHeight}) scale(${k})`, fill: "var(--person)" });
el("ellipse", { cx: 0, cy: 11.5, rx: 8, ry: 11.5 }, person);   // Kopf: Scheitel exakt bei y = 0
el("path", { d: smoothClosedPath(outline) }, person);

// Höhenbemaßung der Person
const px = CONFIG.personX + 34, H = CONFIG.personHeight;
el("line", { x1: px, y1: 0, x2: px, y2: -H, stroke: "var(--accent)", "stroke-width": 0.3 });
for (const y of [0, -H]) {
  el("line", { x1: px - 2.5, y1: y, x2: px + 2.5, y2: y, stroke: "var(--accent)", "stroke-width": 0.35 });
}
el("text", { x: px - 1.2, y: -H / 2, "font-size": 4, "font-weight": 600, fill: "var(--accent)",
  transform: `rotate(-90 ${px - 1.2} ${-H / 2})`, "text-anchor": "middle" }, svg, fmt(H));
el("text", { x: CONFIG.personX, y: 15, "font-size": 3.4, "text-anchor": "middle", fill: "var(--ink)" }, svg, "Mensch");

// Tabelle
const tbl = document.getElementById("tbl");
tbl.innerHTML = `<thead><tr><th>Objekt</th><th class="num">Höhe</th><th class="num">Breite</th><th class="num">Höhe im Verhältnis zur Person</th></tr></thead>`;
const tb = document.createElement("tbody");
tb.innerHTML = `<tr><td>Mensch</td><td class="num">${fmt(H)}</td><td class="num">–</td><td class="num">100 %</td></tr>` +
  CONFIG.boxes.map(b => `<tr><td>${b.name}</td><td class="num">${fmt(b.h)}</td><td class="num">${fmt(b.w)}</td>` +
    `<td class="num">${(b.h / H * 100).toFixed(1).replace(".", ",")} %</td></tr>`).join("");
tbl.appendChild(tb);
</script>
</body>
</html>
