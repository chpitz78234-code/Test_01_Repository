<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/timeline.js"></script>
    <style>
      @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-style: normal; src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: italic; src: url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }
      @font-face { font-family: "Great Vibes"; font-weight: 400; src: url("assets/fonts/great-vibes-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }

      :root {
        --ground: #0b1a33;      /* night blue */
        --ink: #fff6e6;         /* warm snow white */
        --gold: #f2c76b;
        --gold-deep: #c9973a;
        --red: #c8102e;         /* Renfert red (CI) */
        --font-caption: "Cormorant Garamond", Georgia, serif;
        --font-script: "Great Vibes", cursive;
        --font-sign: "Montserrat", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }

      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      video.clip { object-fit: cover; }

      #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 20;
        background: radial-gradient(ellipse 80% 70% at 50% 45%, rgba(11,26,51,0) 55%, rgba(11,26,51,0.42) 100%); }
      #scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 820px; z-index: 30; pointer-events: none;
        background: linear-gradient(to bottom, rgba(11,26,51,0) 0%, rgba(11,26,51,0.30) 45%, rgba(11,26,51,0.62) 100%); }

      #sparkles { position: absolute; inset: 0; z-index: 25; pointer-events: none; }
      .spark { position: absolute; left: 0; top: 0; border-radius: 50%;
        background: radial-gradient(circle, #fff3cf 0%, var(--gold) 45%, rgba(242,199,107,0) 72%); }

      #title { position: absolute; left: 140px; right: 140px; top: 250px; z-index: 40; text-align: center; opacity: 0;
        padding: 46px 20px 40px; border-radius: 36px; background: rgba(11,26,51,0.62);
        box-shadow: 0 10px 60px rgba(11,26,51,0.35); }
      #title .t { display: block; font-family: var(--font-script); font-weight: 400; font-size: 132px; line-height: 1; color: var(--gold);
        text-shadow: 0 0 24px rgba(242,199,107,0.45); }
      #title small { display: block; margin-top: 22px; font-family: var(--font-sign); font-size: 30px;
        letter-spacing: 0.42em; padding-left: 0.42em; color: var(--ink); }

      #captions { position: absolute; left: 90px; right: 90px; top: 1360px; height: 240px; z-index: 50; }
      .line { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
      .plate { display: inline-block; max-width: 900px; padding: 16px 34px 20px; border-radius: 28px;
        background: rgba(11,26,51,0.68); box-shadow: 0 8px 40px rgba(11,26,51,0.30);
        font-family: var(--font-caption); font-weight: 600; font-size: 68px; line-height: 1.1; color: var(--ink); }
      .word { display: inline-block; opacity: 0; margin: 0 0.12em; will-change: transform, opacity, filter; }

      #sign { position: absolute; left: 230px; right: 230px; top: 210px; z-index: 60; text-align: center; opacity: 0;
        padding: 34px 0 30px; border-radius: 30px; background: rgba(11,26,51,0.62); }
      #sign .rule { width: 260px; height: 2px; margin: 0 auto 26px; background: linear-gradient(90deg, rgba(242,199,107,0), var(--gold), rgba(242,199,107,0)); transform-origin: 50% 50%; }
      #sign .name { font-family: var(--font-sign); font-weight: 600; font-size: 56px; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--ink);
        text-shadow: 0 2px 18px rgba(11,26,51,0.7); }
      #sign .tag { margin-top: 18px; font-family: var(--font-caption); font-style: italic; font-weight: 500; font-size: 44px; color: var(--gold);
        text-shadow: 0 2px 14px rgba(11,26,51,0.7); }

      #fadeout { position: absolute; inset: 0; z-index: 90; background: var(--ground); opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="31.8" data-width="1080" data-height="1920">
      <!-- VIDEOS:BEGIN (generated by tools/prepare_hyperframes.py) -->
      <video id="v-S2" class="clip scene" src="assets/video/S2.mp4" data-start="0" data-duration="3.6" data-track-index="0" muted playsinline style="z-index:1"></video>
      <video id="v-S3" class="clip scene" src="assets/video/S3.mp4" data-start="3.25" data-duration="3.35" data-track-index="1" muted playsinline style="z-index:2"></video>
      <video id="v-S4" class="clip scene" src="assets/video/S4.mp4" data-start="6.25" data-duration="3.55" data-track-index="0" muted playsinline style="z-index:3"></video>
      <video id="v-S6" class="clip scene" src="assets/video/S6.mp4" data-start="8.9" data-duration="4.7" data-track-index="1" muted playsinline style="z-index:4"></video>
      <video id="v-S7" class="clip scene" src="assets/video/S7.mp4" data-start="13.25" data-duration="6.15" data-track-index="0" muted playsinline style="z-index:5"></video>
      <video id="v-S8" class="clip scene" src="assets/video/S8.mp4" data-start="19.05" data-duration="3.75" data-track-index="1" muted playsinline style="z-index:6"></video>
      <video id="v-S9" class="clip scene" src="assets/video/S9.mp4" data-start="22.45" data-duration="9.35" data-track-index="0" muted playsinline style="z-index:7"></video>
      <!-- VIDEOS:END -->

      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="31.8" data-track-index="5" data-volume="1"></audio>

      <div id="vignette"></div>
      <div id="sparkles"></div>
      <div id="scrim"></div>

      <h1 id="title"><span class="t">Crafted Together</span><small>A CHRISTMAS POEM</small></h1>
      <div id="captions"></div>
      <div id="sign">
        <div class="rule"></div>
        <div class="name">RENFERT</div>
        <div class="tag">Season’s Greetings</div>
      </div>
      <div id="fadeout"></div>
    </div>

    <script>
      (function () {
        const F = window.FILM;
        const tl = gsap.timeline({ paused: true });

        // ---- scene crossfades: the incoming clip lies on top and fades in ----
        F.scenes.forEach((s) => {
          if (s.fade_in > 0) {
            tl.fromTo("#v-" + s.id, { opacity: 0 }, { opacity: 1, duration: s.fade_in, ease: "sine.inOut" }, s.start);
          }
        });

        // ---- intro title ----
        tl.fromTo("#title", { opacity: 0, y: 40, filter: "blur(12px)" },
                  { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.1, ease: "power2.out" }, 0.35);
        tl.to("#title", { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.7, ease: "power1.in" }, 2.85);

        // ---- captions: one line at a time, words appear as they are spoken ----
        const box = document.getElementById("captions");
        F.captions.forEach((c, i) => {
          const line = document.createElement("div");
          line.className = "line";
          const plate = document.createElement("div");
          plate.className = "plate";
          line.appendChild(plate);
          c.words.forEach((w) => {
            const sp = document.createElement("span");
            sp.className = "word";
            sp.textContent = w.w;
            plate.appendChild(sp);
          });
          box.appendChild(line);
          const words = line.querySelectorAll(".word");
          tl.fromTo(plate, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, c.start - 0.22);
          c.words.forEach((w, k) => {
            tl.fromTo(words[k], { opacity: 0, y: 16, filter: "blur(6px)", color: "#f2c76b" },
                      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power2.out" }, w.t - 0.06);
            tl.to(words[k], { color: "#fff6e6", duration: 0.7, ease: "sine.out" }, w.t + 0.3);
          });
          const next = F.captions[i + 1];
          const out = next ? Math.min(next.start - 0.12, c.end + 0.9) : 28.3;
          tl.to(line, { opacity: 0, y: -12, duration: 0.3, ease: "power1.in" }, out - 0.3);
        });

        // ---- sign-off ----
        tl.fromTo("#sign", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 28.5);
        tl.fromTo("#sign .rule", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 28.6);
        tl.fromTo("#sign .name", { scale: 1.08, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 1.4, ease: "power3.out" }, 28.5);
        tl.to("#fadeout", { opacity: 1, duration: 0.6, ease: "sine.in" }, F.duration - 0.6);

        // ---- golden sparkles: deterministic drift (seeded LCG, no Math.random) ----
        let seed = 20261224;
        const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
        const layer = document.getElementById("sparkles");
        for (let i = 0; i < 34; i++) {
          const p = document.createElement("div");
          p.className = "spark";
          const size = 6 + rnd() * 14;
          p.style.width = p.style.height = size + "px";
          layer.appendChild(p);
          const x0 = rnd() * 1080, y0 = rnd() * 1920;
          const fall = 28 + rnd() * 46;                 // px per second
          const sway = 18 + rnd() * 40, period = 3 + rnd() * 4, phase = rnd() * 6.28;
          const tw = 0.8 + rnd() * 1.6, base = 0.25 + rnd() * 0.5;
          const st = { t: 0 };
          tl.to(st, {
            t: F.duration, duration: F.duration, ease: "none",
            onUpdate: () => {
              const t = st.t;
              const y = ((y0 + fall * t) % 1990) - 40;
              const x = x0 + Math.sin(t * 6.283 / period + phase) * sway;
              const o = base * (0.55 + 0.45 * Math.sin(t * 6.283 / tw + phase));
              p.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
              p.style.opacity = o.toFixed(3);
            },
          }, 0);
        }

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
