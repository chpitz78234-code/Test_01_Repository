      :root {
        --ground: #0b1a33;      /* night blue */
        --ink: #fff6e6;         /* warm snow white */
        --gold: #f2c76b;
        --gold-deep: #c9973a;
        --red: #c8102e;         /* Renfert red (CI) */
        --font-caption: "Cormorant Garamond", Georgia, serif;
        --font-script: "Great Vibes", cursive;
        --font-sign: "Montserrat", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }

      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      video.clip { object-fit: cover; }

      #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 20;
        background: radial-gradient(ellipse 80% 70% at 50% 45%, rgba(11,26,51,0) 55%, rgba(11,26,51,0.42) 100%); }
      #scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 820px; z-index: 30; pointer-events: none;
        background: linear-gradient(to bottom, rgba(11,26,51,0) 0%, rgba(11,26,51,0.30) 45%, rgba(11,26,51,0.62) 100%); }

      #sparkles { position: absolute; inset: 0; z-index: 25; pointer-events: none; }
      .spark { position: absolute; left: 0; top: 0; border-radius: 50%;
        background: radial-gradient(circle, #fff3cf 0%, var(--gold) 45%, rgba(242,199,107,0) 72%); }

      #title { position: absolute; left: 140px; right: 140px; top: 250px; z-index: 40; text-align: center; opacity: 0;
        padding: 46px 20px 40px; border-radius: 36px; background: rgba(11,26,51,0.62);
        box-shadow: 0 10px 60px rgba(11,26,51,0.35); }
      #title .t { display: block; font-family: var(--font-script); font-weight: 400; font-size: 132px; line-height: 1; color: var(--gold);
        text-shadow: 0 0 24px rgba(242,199,107,0.45); }
      #title small { display: block; margin-top: 22px; font-family: var(--font-sign); font-size: 30px;
        letter-spacing: 0.42em; padding-left: 0.42em; color: var(--ink); }

      #captions { position: absolute; left: 90px; right: 90px; top: 1360px; height: 240px; z-index: 50; }
      .line { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
      .plate { display: inline-block; max-width: 900px; padding: 16px 34px 20px; border-radius: 28px;
        background: rgba(11,26,51,0.68); box-shadow: 0 8px 40px rgba(11,26,51,0.30);
        font-family: var(--font-caption); font-weight: 600; font-size: 68px; line-height: 1.1; color: var(--ink); }
      .word { display: inline-block; opacity: 0; margin: 0 0.12em; will-change: transform, opacity, filter; }

      #sign { position: absolute; left: 230px; right: 230px; top: 210px; z-index: 60; text-align: center; opacity: 0;
        padding: 34px 0 30px; border-radius: 30px; background: rgba(11,26,51,0.62); }
      #sign .rule { width: 260px; height: 2px; margin: 0 auto 26px; background: linear-gradient(90deg, rgba(242,199,107,0), var(--gold), rgba(242,199,107,0)); transform-origin: 50% 50%; }
      #sign .name { font-family: var(--font-sign); font-weight: 600; font-size: 56px; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--ink);
        text-shadow: 0 2px 18px rgba(11,26,51,0.7); }
      #sign .tag { margin-top: 18px; font-family: var(--font-caption); font-style: italic; font-weight: 500; font-size: 44px; color: var(--gold);
        text-shadow: 0 2px 14px rgba(11,26,51,0.7); }

      #fadeout { position: absolute; inset: 0; z-index: 90; background: var(--ground); opacity: 0; pointer-events: none; }
